name: guardrail-v4

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: guardrail-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  same-name-shadow-fixture:
    name: guardrail-v4.2
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create an untrusted same-name check fixture
        run: echo "This GitHub Actions check must not satisfy the GitHub App identity gate."

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind this run to the triggering SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Validated commit: $EXPECTED_SHA"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build validation
        run: npm run build

      - name: Guardrail doctor
        if: ${{ always() }}
        run: npm run doctor
